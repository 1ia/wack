<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Chess Analysis</title>

    <!-- Chessboard styles -->
    <link rel="stylesheet"
      href="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  </head>

  <body>
    <h2>Chess Analysis Board</h2>

    <div id="board" style="width: 400px; margin-bottom: 10px;"></div>

    <button onclick="resetBoard()">Reset</button>
    <button onclick="flipBoard()">Flip</button>

    <!-- Chess logic -->
    <script src="https://unpkg.com/chess.js@1.0.0/chess.min.js"></script>

    <!-- Chessboard display -->
    <script src="https://unpkg.com/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

    <script>
      var game = new Chess();

      var board = Chessboard('board', {
        draggable: true,
        position: 'start',
        onDrop: onDrop
      });

      function onDrop(source, target) {
        var move = game.move({
          from: source,
          to: target,
          promotion: 'q'
        });

        if (move === null) return 'snapback';
      }

      function resetBoard() {
        game.reset();
        board.start();
      }

      function flipBoard() {
        board.flip();
      }
    </script>
  </body>
</html>
